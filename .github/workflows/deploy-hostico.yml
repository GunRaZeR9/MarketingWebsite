name: Deploy to Hostico

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --base-href=/
        env:
          NX_NO_CLOUD: true

      - name: Create Hostico upload bundle
        run: |
          cd dist/marketing-website/browser
          find . -type f ! -name 'SHA256SUMS.txt' ! -name 'hostico-upload.zip' -exec sha256sum {} + | sort > SHA256SUMS.txt
          zip -r ../hostico-upload.zip .

      - name: Upload Hostico bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostico-upload
          path: dist/marketing-website/hostico-upload.zip
