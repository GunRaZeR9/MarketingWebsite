<main>
  <section class="panel">
    <p class="eyebrow">{{ content().ui.aboutEyebrow }}</p>
    <h1>{{ content().ui.aboutTitle }}</h1>
    <p>
      {{ content().ui.aboutLead }}
    </p>
  </section>

  <section class="panel">
    <h2>{{ content().advantagesTitle }}</h2>
    <div class="grid-2">
      <article *ngFor="let advantage of content().advantages" class="advantage">
        <h3>{{ advantage.title }}</h3>
        <p>{{ advantage.description }}</p>
      </article>
    </div>
  </section>
</main>
