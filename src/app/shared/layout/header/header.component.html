<header class="site-header">
  <div class="brand">
    <img ngSrc="/images/logos/yellow_dot.png" alt="oOumm logo" width="28" height="28" />
    <span>{{ content().brandName }}</span>
  </div>

  <nav aria-label="Main navigation">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ content().ui.nav[item.key] }}
    </a>
  </nav>

  <div class="actions">
    <label class="language-picker">
      <span>{{ content().ui.languageLabel }}</span>
      <select [value]="currentLanguage()" (change)="setLanguage($any($event.target).value)">
        <option *ngFor="let language of languages" [value]="language.code">{{ language.label }}</option>
      </select>
    </label>

    <a class="cta" routerLink="/contact">{{ content().ui.headerCta }}</a>
  </div>
</header>
