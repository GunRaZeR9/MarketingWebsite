@if (visible()) {
  <div class="cookie-consent" role="dialog" aria-label="Cookie consent">
    <p class="cookie-consent__message">
      {{ content().ui.cookieConsentMessage }}
      <a routerLink="/cookie-policy">{{ content().ui.footerCookiePolicy }}</a>
    </p>
    <div class="cookie-consent__actions">
      <button class="cookie-consent__btn cookie-consent__btn--decline" (click)="decline()">
        {{ content().ui.cookieConsentDecline }}
      </button>
      <button class="cookie-consent__btn cookie-consent__btn--accept" (click)="accept()">
        {{ content().ui.cookieConsentAccept }}
      </button>
    </div>
  </div>
}
